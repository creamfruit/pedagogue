<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0a1120" />
    <meta name="description" content="Your repertoire, your weaknesses, your route to the next piece." />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="icon" type="image/svg+xml" href="/icons/favicon.svg" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <title>Piano Pedagogue</title>
  </head>
  <body>
    <div id="boot" class="boot">
      <div class="boot-ring"></div>
      <p class="boot-text">Initialising</p>
    </div>

    <div id="app" class="app" hidden>
      <header class="topbar">
        <a class="brand" href="/" data-link>
          <span class="brand-mark" aria-hidden="true"></span>
          <span class="brand-text">Piano<em>Pedagogue</em></span>
        </a>
        <nav id="nav" class="nav" aria-label="Main">
          <a href="/" data-link data-nav="/">Today</a>
          <a href="/repertoire" data-link data-nav="/repertoire">Repertoire</a>
          <a href="/constellation" data-link data-nav="/constellation">Constellation</a>
          <a href="/practice" data-link data-nav="/practice">Practice</a>
          <a href="/progress" data-link data-nav="/progress /progression /performances">Progress</a>
          <a href="/observatory" data-link data-nav="/observatory">Observatory</a>
        </nav>
        <div class="topbar-right">
          <a id="wallet" class="wallet" href="/observatory" data-link hidden></a>
          <span id="net-status" class="pill pill-warn" title="Connection status" hidden>offline</span>
          <div id="account" class="account" hidden>
            <button id="account-toggle" class="account-button" type="button" aria-haspopup="menu" aria-expanded="false" aria-controls="account-menu"></button>
            <div id="account-menu" class="account-menu" role="menu" hidden>
              <p id="account-name" class="account-name"></p>
              <a href="/me" data-link role="menuitem">Me</a>
              <a href="/settings" data-link role="menuitem">Settings</a>
              <button id="sign-out" type="button" role="menuitem">Sign out</button>
            </div>
          </div>
          <button id="nav-toggle" class="icon-button" aria-label="Menu" aria-expanded="false" aria-controls="nav">
            <span></span><span></span><span></span>
          </button>
        </div>
      </header>

      <div id="offline-banner" class="offline-banner" role="status" hidden>
        <strong>Offline.</strong>
        <span>Showing what's saved on this device. Notes you write are kept and sent when you're back online.</span>
        <span id="offline-waiting"></span>
      </div>

      <main id="view" class="view" tabindex="-1"></main>

      <footer class="footer">
        <span id="build-tag" class="mono"></span>
      </footer>

      <nav id="tabbar" class="tabbar" aria-label="Main tabs" hidden>
        <a class="tabbar-item" href="/" data-link data-nav="/ /mission">
          <svg class="tabbar-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3.2l2.1 5.4 5.7.4-4.4 3.7 1.4 5.6L12 15.3 7.2 18.3l1.4-5.6L4.2 9l5.7-.4z" /></svg>
          <span class="tabbar-label">Today</span>
        </a>
        <a class="tabbar-item" href="/constellation" data-link data-nav="/constellation">
          <svg class="tabbar-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 17l5-8 5 5 4-9" /><circle cx="5" cy="17" r="1.6" /><circle cx="10" cy="9" r="1.6" /><circle cx="15" cy="14" r="1.6" /><circle cx="19" cy="5" r="1.6" /></svg>
          <span class="tabbar-label">Sky</span>
        </a>
        <a class="tabbar-item" href="/repertoire" data-link data-nav="/repertoire">
          <svg class="tabbar-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 4.5h10a3 3 0 013 3V20H8a3 3 0 01-3-3z" /><path d="M5 17a3 3 0 013-3h10" /></svg>
          <span class="tabbar-label">Library</span>
        </a>
        <a class="tabbar-item" href="/me" data-link data-nav="/me /settings /progress /progression /performances /observatory /practice /roulette /credits /pricing /admin">
          <svg class="tabbar-icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8.5" r="3.6" /><path d="M5 20c.6-3.7 3.4-5.8 7-5.8s6.4 2.1 7 5.8" /></svg>
          <span class="tabbar-label">Me</span>
        </a>
      </nav>
    </div>

    <div id="toasts" class="toasts" role="status" aria-live="polite"></div>

    <div id="update-bar" class="update-bar" hidden>
      <span>A new version is ready.</span>
      <button id="update-apply" class="btn btn-small">Reload</button>
      <button id="update-dismiss" class="btn btn-small btn-ghost">Later</button>
    </div>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
