services:
  db:
    image: pgvector/pgvector:pg16
    container_name: piano-db
    environment:
      POSTGRES_USER: piano
      POSTGRES_PASSWORD: piano
      POSTGRES_DB: piano
    ports:
      - "5432:5432"
    volumes:
      - piano_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U piano -d piano"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: piano-redis
    ports:
      - "6379:6379"

volumes:
  piano_pgdata:
