databases:
  - name: pedagogue-db
    databaseName: piano
    user: piano
    plan: basic-256mb
    postgresMajorVersion: "16"
    ipAllowList: []

services:
  - type: web
    name: pedagogue-api
    runtime: docker
    rootDir: backend
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: starter
    region: oregon
    healthCheckPath: /health
    preDeployCommand: scripts/release.sh
    autoDeploy: true
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: DEBUG
        value: "false"
      - key: DATABASE_URL
        fromDatabase:
          name: pedagogue-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: pedagogue-redis
          property: connectionString
      - key: JOB_QUEUE
        value: redis
      - key: SECRET_KEY
        generateValue: true
      - key: WEBSITE_URL
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: STORAGE_ENDPOINT
        sync: false
      - key: STORAGE_BUCKET
        sync: false
      - key: STORAGE_ACCESS_KEY
        sync: false
      - key: STORAGE_SECRET_KEY
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: ADMIN_EMAILS
        sync: false
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: STRIPE_PRICE_MONTHLY
        sync: false
      - key: STRIPE_PRICE_YEARLY
        sync: false
      - key: STRIPE_TRIAL_DAYS
        value: "7"
      - key: MAX_UPLOAD_MB
        value: "50"
      - key: UPLOAD_QUOTA_MB
        value: "500"
      - key: RATE_LIMIT_STORAGE
        value: redis
      - key: SENTRY_DSN
        sync: false
      - key: BACKUP_BUCKET
        sync: false

  - type: worker
    name: pedagogue-worker
    runtime: docker
    rootDir: backend
    dockerfilePath: ./Dockerfile
    dockerContext: .
    dockerCommand: scripts/worker.sh
    plan: starter
    region: oregon
    autoDeploy: true
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: DEBUG
        value: "false"
      - key: DATABASE_URL
        fromDatabase:
          name: pedagogue-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: pedagogue-redis
          property: connectionString
      - key: JOB_QUEUE
        value: redis
      - key: SECRET_KEY
        fromService:
          type: web
          name: pedagogue-api
          envVarKey: SECRET_KEY
      - key: STORAGE_ENDPOINT
        fromService:
          type: web
          name: pedagogue-api
          envVarKey: STORAGE_ENDPOINT
      - key: STORAGE_BUCKET
        fromService:
          type: web
          name: pedagogue-api
          envVarKey: STORAGE_BUCKET
      - key: STORAGE_ACCESS_KEY
        fromService:
          type: web
          name: pedagogue-api
          envVarKey: STORAGE_ACCESS_KEY
      - key: STORAGE_SECRET_KEY
        fromService:
          type: web
          name: pedagogue-api
          envVarKey: STORAGE_SECRET_KEY
      - key: ANTHROPIC_API_KEY
        fromService:
          type: web
          name: pedagogue-api
          envVarKey: ANTHROPIC_API_KEY
      - key: SENTRY_DSN
        fromService:
          type: web
          name: pedagogue-api
          envVarKey: SENTRY_DSN

  - type: cron
    name: pedagogue-backup
    runtime: docker
    rootDir: backend
    dockerfilePath: ./Dockerfile
    dockerContext: .
    dockerCommand: scripts/backup.sh
    schedule: "0 3 * * *"
    plan: starter
    region: oregon
    autoDeploy: true
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: DEBUG
        value: "false"
      - key: DATABASE_URL
        fromDatabase:
          name: pedagogue-db
          property: connectionString
      - key: BACKUP_BUCKET
        fromService:
          type: web
          name: pedagogue-api
          envVarKey: BACKUP_BUCKET
      - key: BACKUP_RETENTION_DAYS
        value: "30"
      - key: STORAGE_ENDPOINT
        fromService:
          type: web
          name: pedagogue-api
          envVarKey: STORAGE_ENDPOINT
      - key: STORAGE_BUCKET
        fromService:
          type: web
          name: pedagogue-api
          envVarKey: STORAGE_BUCKET
      - key: STORAGE_ACCESS_KEY
        fromService:
          type: web
          name: pedagogue-api
          envVarKey: STORAGE_ACCESS_KEY
      - key: STORAGE_SECRET_KEY
        fromService:
          type: web
          name: pedagogue-api
          envVarKey: STORAGE_SECRET_KEY
      - key: SENTRY_DSN
        fromService:
          type: web
          name: pedagogue-api
          envVarKey: SENTRY_DSN

  - type: keyvalue
    name: pedagogue-redis
    plan: starter
    region: oregon
    maxmemoryPolicy: noeviction
    ipAllowList: []

  - type: web
    name: pedagogue-web
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: VITE_API_URL
        sync: false
      - key: VITE_SENTRY_DSN
        sync: false
    headers:
      - path: /sw.js
        name: Cache-Control
        value: no-cache
      - path: /index.html
        name: Cache-Control
        value: no-cache
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
    routes:
      - type: rewrite
        source: /sitemap.xml
        destination: https://pedagogue-api.onrender.com/public/sitemap.xml
      - type: rewrite
        source: /robots.txt
        destination: https://pedagogue-api.onrender.com/public/robots.txt
      - type: rewrite
        source: /music
        destination: https://pedagogue-api.onrender.com/public/music
      - type: rewrite
        source: /music/*
        destination: https://pedagogue-api.onrender.com/public/music/*
      - type: rewrite
        source: /composers
        destination: https://pedagogue-api.onrender.com/public/composers
      - type: rewrite
        source: /composers/*
        destination: https://pedagogue-api.onrender.com/public/composers/*
      - type: rewrite
        source: /*
        destination: /index.html
